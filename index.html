<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>KTM ADV 390 R — D.L.B MotoSport</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root { --orange: #ff6600; --orange-dark: #cc5200; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: 'Heebo', system-ui, -apple-system, sans-serif;
  }
  a { color: inherit; }

  .site { direction: rtl; background: #0a0a0a; min-height: 100vh; }

  /* ─── Top bar ─── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,102,0,0.22);
  }
  .topbar .ktm-box {
    height: 26px; width: auto;
    background: var(--orange);
    padding: 5px 8px;
    border-radius: 5px;
    box-sizing: content-box;
    display: block;
  }
  .topbar .dlb { height: 30px; width: auto; display: block; }

  /* ─── Hero ─── */
  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .hero::before { content: none; }

  .hero-media { order: 0; position: relative; width: 100%; }
  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  .video-el {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    background: #000;
  }
  .play-btn {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; cursor: pointer;
  }
  .play-btn-inner {
    width: 64px; height: 64px;
    border-radius: 999px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 160ms ease, background 160ms ease;
  }
  .play-btn:hover .play-btn-inner { transform: scale(1.06); background: rgba(255,102,0,0.85); }
  .play-btn-inner svg { color: #fff; }
  .warranty-badge {
    position: absolute;
    left: 10px; bottom: 8px;
    width: 76px; height: auto;
    z-index: 3;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  }
  .video-caption {
    position: absolute;
    right: 12px; bottom: 10px;
    z-index: 3;
    color: #fff; text-align: right; line-height: 1.05;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  .video-caption .model { font-weight: 900; font-size: 22px; letter-spacing: 0.5px; }
  .video-caption .model em { font-style: normal; color: var(--orange); }
  .scroll-hint {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    pointer-events: none;
    transition: opacity 240ms ease;
  }
  .scroll-hint .label { color: rgba(255,255,255,0.7); font-size: 10px; letter-spacing: 0.15em; }
  .scroll-hint svg { color: var(--orange); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  /* hero panel (headline + offer) */
  .hero-panel {
    order: 1;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
    padding: 28px 20px 8px;
  }
  .hero-head { display: none !important; }
  .hero-head h1 { color: #fff; font-weight: 900; font-size: 34px; line-height: 1.25; margin: 0; }
  .hero-head h2 { color: var(--orange); font-weight: 900; font-size: 52px; line-height: 1.05; letter-spacing: -1px; margin: 6px 0 0; }

  /* offer card */
  .offer {
    width: 100%;
    max-width: 360px;
    border-radius: 28px;
    border: 2px solid var(--orange);
    background: linear-gradient(180deg, #121212 0%, #0a0a0a 100%);
    padding: 28px 20px 26px;
    text-align: center;
    box-shadow: 0 20px 50px -20px rgba(255,102,0,0.35);
  }
  .offer-eyebrow { color: rgba(232,232,232,0.55); font-size: 12px; letter-spacing: 0.22em; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
  .offer-eyebrow .dot { color: var(--orange); margin: 0 6px; }
  .offer-price { display: flex; align-items: baseline; justify-content: center; gap: 6px; line-height: 1; }
  .offer-price .num { font-weight: 900; font-size: 64px; color: var(--orange); font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .offer-price .currency { font-weight: 800; font-size: 26px; color: #fff; }
  .offer-price .per { color: rgba(232,232,232,0.6); font-size: 16px; }
  .offer-terms { color: #fff; font-weight: 800; font-size: 18px; margin-top: 14px; }
  .offer-fine { color: rgba(232,232,232,0.45); font-size: 12px; margin-top: 4px; }
  .offer-full { color: rgba(232,232,232,0.55); font-size: 13px; margin-top: 10px; font-weight: 500; }
  .offer-full b { color: #fff; font-weight: 700; }
  .offer-divider { height: 1px; background: rgba(255,102,0,0.18); margin: 16px 0 14px; }
  .offer-pay { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .offer-pay svg { color: var(--orange); flex-shrink: 0; }
  .offer-pay .pay-txt { text-align: right; line-height: 1.25; }
  .offer-pay .pay-txt .t1 { color: var(--orange); font-weight: 900; font-size: 16px; letter-spacing: 0.04em; }
  .offer-pay .pay-txt .t2 { color: rgba(232,232,232,0.7); font-size: 12.5px; font-weight: 500; }

  /* ─── Form ─── */
  .form-wrap { padding: 22px 20px 36px; }
  .form-card {
    max-width: 380px;
    margin: 0 auto;
    border-radius: 28px;
    background: #111;
    border: 1px solid rgba(255,102,0,0.18);
    padding: 22px 18px 20px;
    box-shadow: 0 18px 40px -25px rgba(0,0,0,0.8);
  }
  .form-head { text-align: center; margin-bottom: 14px; }
  .form-head .lead { color: var(--orange); font-weight: 900; font-size: 22px; line-height: 1.15; }
  .form-head .sub { color: #fff; font-weight: 600; font-size: 14px; line-height: 1.2; margin-top: 2px; }

  .form-row { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .field-cell { display: flex; flex-direction: column; gap: 4px; }
  .field {
    width: 100%;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 16px;
    color: #fff;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 160ms ease, background 160ms ease;
  }
  .field::placeholder { color: #666; }
  .field:focus { border-color: var(--orange); background: #232323; }
  .field.invalid { border-color: #e0402b; background: #241818; }
  .field-select {
    background-image: linear-gradient(45deg, transparent 50%, #888 50%), linear-gradient(135deg, #888 50%, transparent 50%);
    background-position: left 18px center, left 12px center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-left: 36px;
  }
  .field-err { color: #ff7a66; font-size: 11.5px; text-align: right; }

  .form-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .consent { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .consent input { position: absolute; opacity: 0; width: 0; height: 0; }
  .consent .box {
    flex-shrink: 0; width: 22px; height: 22px;
    border-radius: 7px; border: 1.5px solid #444; background: #1e1e1e;
    display: flex; align-items: center; justify-content: center;
    transition: all 150ms ease;
  }
  .consent input:checked + .box { background: var(--orange); border-color: var(--orange); }
  .consent .box svg { color: #000; opacity: 0; transition: opacity 120ms ease; }
  .consent input:checked + .box svg { opacity: 1; }
  .consent.invalid .box { border-color: #e0402b; }
  .consent .txt { color: rgba(232,232,232,0.7); font-size: 13px; line-height: 1.4; }
  .submit {
    width: 100%;
    background: var(--orange);
    color: #000;
    border: none;
    border-radius: 18px;
    padding: 16px;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: background 160ms ease;
  }
  .submit:hover { background: var(--orange-dark); }
  .submit:disabled { opacity: 0.5; cursor: default; }
  .privacy-note { color: #666; font-size: 11.5px; text-align: center; margin-top: 12px; line-height: 1.5; }
  .privacy-link { color: var(--orange); text-decoration: underline; font-weight: 600; }

  /* ─── Thank-you popup ─── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fade 220ms ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 360px;
    background: linear-gradient(180deg, #161616 0%, #0c0c0c 100%);
    border: 1px solid rgba(255,102,0,0.3);
    border-radius: 28px;
    padding: 32px 26px 26px;
    text-align: center;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.8);
    animation: pop 260ms cubic-bezier(0.2,1.2,0.3,1);
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .check {
    width: 62px; height: 62px; border-radius: 999px;
    background: rgba(255,102,0,0.14); border: 1.5px solid var(--orange);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .modal .check svg { color: var(--orange); }
  .modal h3 { color: #fff; font-size: 24px; font-weight: 900; margin: 0 0 6px; }
  .modal p { color: rgba(232,232,232,0.65); font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  .modal .quick { color: rgba(232,232,232,0.55); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .modal .arrow { display: flex; justify-content: center; margin-bottom: 8px; }
  .modal .arrow svg { color: var(--orange); animation: bob 1.4s ease-in-out infinite; }
  .wa-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: #25D366; color: #fff;
    border: none; border-radius: 16px; padding: 15px;
    font-size: 16px; font-weight: 800; font-family: inherit;
    text-align: center; cursor: pointer; text-decoration: none;
    transition: background 150ms ease;
  }
  .wa-btn:hover { background: #1eb955; }
  .modal .close { background: none; border: none; color: rgba(232,232,232,0.4); font-size: 13px; font-family: inherit; margin-top: 12px; cursor: pointer; text-decoration: underline; }

  /* ════════ MOBILE SCALE-UP ════════ */
  @media (max-width: 859px) {
    .hero-panel {
      gap: 28px;
      padding: 34px 16px 12px;
    }
    .offer {
      max-width: 100%;
      padding: 34px 24px 32px;
    }
    .offer-eyebrow { font-size: 14px; letter-spacing: 0.2em; margin-bottom: 12px; }
    .offer-price .num { font-size: 80px; }
    .offer-price .currency { font-size: 32px; }
    .offer-price .per { font-size: 20px; }
    .offer-terms { font-size: 22px; margin-top: 18px; }
    .offer-fine { font-size: 14px; }
    .offer-full { font-size: 16px; margin-top: 12px; }
    .offer-divider { margin: 20px 0 18px; }
    .offer-pay svg { width: 36px; height: 36px; }
    .offer-pay .pay-txt .t1 { font-size: 20px; }
    .offer-pay .pay-txt .t2 { font-size: 15px; }
  }

  /* ════════ DESKTOP ════════ */
  @media (min-width: 860px) {
    .topbar { padding: 14px 40px; }
    .topbar .ktm-box { height: 34px; padding: 7px 11px; border-radius: 6px; }
    .topbar .dlb { height: 42px; }

    .hero {
      flex-direction: row;
      align-items: stretch;
      min-height: 560px;
      background-image: url('assets/hero-bike.jpg');
      background-size: cover;
      background-position: center;
    }
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.62) 45%, rgba(0,0,0,0.85) 100%);
      pointer-events: none; z-index: 1;
    }

    .hero-panel {
      order: 0;
      width: 40%; min-width: 360px;
      justify-content: center;
      gap: 26px;
      padding: 48px 40px;
    }
    .hero-head { display: block; }

    .hero-media {
      order: 1;
      flex: 1; min-width: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
      position: relative;
      z-index: 2;
    }
    .video-frame {
      max-width: 720px;
      border-radius: 16px;
      box-shadow: 0 30px 70px -25px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.06);
    }
    .play-btn-inner { width: 78px; height: 78px; }
    .warranty-badge { left: 14px; bottom: 12px; width: 92px; }
    .video-caption { display: none; }
    .scroll-hint { display: none; }

    .offer { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); background: linear-gradient(180deg, rgba(18,18,18,0.92) 0%, rgba(8,8,8,0.92) 100%); }

    .form-wrap {
      background: #0f0f0f;
      border-top: 1px solid rgba(255,102,0,0.2);
      padding: 32px 40px 40px;
    }
    .form-card {
      max-width: 1040px;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      border-radius: 0;
    }
    .form-head .lead { font-size: 26px; }
    .form-head .sub { font-size: 15px; }
    .form-row { grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .field { border-radius: 14px; }
    .form-actions {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 18px;
    }
    .submit { width: auto; padding: 0 40px; height: 52px; border-radius: 14px; }
    .privacy-note { text-align: right; margin-top: 0; font-size: 12px; flex: 1; }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0a0a0a"/>
      <rect x="28" y="40" width="44" height="20" rx="3" fill="#ff6600"/>
      <text x="50" y="55" font-family="sans-serif" font-size="11" font-weight="900" fill="#000" text-anchor="middle">KTM</text>
    </svg>
  </template>
  <div id="root"></div>
  <script type="text/babel">
    const WEBHOOK = "https://hook.eu1.make.com/cj13oqusi8whr17zdenvha4wersapub6";
    const WA_LINK = "https://api.whatsapp.com/send?phone=972527358014&text=%D7%94%D7%99%D7%99%2C%20%D7%90%D7%A0%D7%99%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%9F%20%D7%91ADV%20390%20R%20";
    const PRIVACY = "https://www.motosport.co.il/page/%D7%9E%D7%93%D7%99%D7%A0%D7%99%D7%95%D7%AA-%D7%94%D7%A4%D7%A8%D7%98%D7%99%D7%95%D7%AA";
    const AGENCIES = [
      "אופנועי כרמיאל","מוטוגז - ראש פינה","מוטופאן - עפולה","סביון אופנועים - קרית ביאליק",
      "אולם ראשי - ת\"א","אוף-רוד - ת\"א","מאי מוטו - נתניה","ביג בן אופנועים - ירושלים",
      "מוטוספיד - מישור אדומים","RPM - רמת השרון","המכונאי - יבנה","מלכי רייסינג - קרית גת",
      "אקסטרים מוטוספורט - ב\"ש","סטאר אופנועים - אילת",
    ];

    function Site() {
      const scrollRef = React.useRef(null);
      const videoRef = React.useRef(null);
      const [playing, setPlaying] = React.useState(false);
      const handlePlay = () => { if (videoRef.current) { videoRef.current.play(); setPlaying(true); } };
      const [showHint, setShowHint] = React.useState(true);
      const [form, setForm] = React.useState({ name: "", phone: "", email: "", agency: "" });
      const [consent, setConsent] = React.useState(false);
      const [submitted, setSubmitted] = React.useState(false);
      const [done, setDone] = React.useState(false);
      const [sending, setSending] = React.useState(false);

      React.useEffect(() => {
        const onScroll = () => setShowHint(window.scrollY < 40);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const phoneOk = /^0\d{1,2}-?\d{7}$/.test(form.phone.replace(/\s/g, ""));
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email);
      const nameOk = form.name.trim().length >= 2;
      const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitted(true);
        if (!(nameOk && phoneOk && emailOk && consent)) return;
        setSending(true);
        try {
          await fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: form.name.trim(), phone: form.phone.trim(), email: form.email.trim(),
              agency: form.agency || "", consent: true, model: "KTM ADV 390 R", source: "landing",
              submittedAt: new Date().toISOString(),
              date: new Date().toLocaleDateString("he-IL", { timeZone: "Asia/Jerusalem" }),
              time: new Date().toLocaleTimeString("he-IL", { timeZone: "Asia/Jerusalem" }),
            }),
          });
        } catch (err) { console.warn("webhook error", err); }
        setSending(false);
        setDone(true);
      };

      return (
        <div className="site" ref={scrollRef}>
          {/* Top bar */}
          <header className="topbar">
            <img className="ktm-box" src="assets/ktm-box.png" alt="KTM" />
            <img className="dlb" src="assets/dlb-logo-v2.png" alt="D.L.B MotoSport" />
          </header>

          {/* Hero */}
          <section className="hero">
            <div className="hero-media">
              <div className="video-frame">
                <video
                  ref={videoRef}
                  className="video-el"
                  src="https://pub-ce60e0901a0940d19d8a65b4856be61d.r2.dev/adv-390-r-hq.mp4"
                  poster="assets/cover.jpg"
                  playsInline
                  controls={playing}
                  onEnded={() => setPlaying(false)}
                />
                {!playing && (
                  <div className="play-btn" onClick={handlePlay}>
                    <div className="play-btn-inner">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                  </div>
                )}
                {!playing && <div className="video-caption"><div className="model">ADV <em>390 R</em></div></div>}
                <img className="warranty-badge" src="assets/warranty-4y.png" alt="4 שנות אחריות" />
                {!playing && (
                  <div className="scroll-hint" style={{ opacity: showHint ? 1 : 0 }}>
                    <span className="label">גלול למטה</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>
                  </div>
                )}
              </div>
            </div>

            <div className="hero-panel">
              <div className="hero-head">
                <h1>יש כאלה שרוכבים בכביש<br/>ויש כאלה שרוכבים על</h1>
                <h2>ADV 390 R</h2>
              </div>
              <div className="offer">
                <div className="offer-eyebrow">ADV 390 R <span className="dot">·</span> החל מ-</div>
                <div className="offer-price">
                  <span className="num">1,958</span>
                  <span className="currency">₪</span>
                  <span className="per">/ לחודש</span>
                </div>
                <div className="offer-terms">24 תשלומים ללא ריבית</div>
                <div className="offer-fine">בכרטיס אשראי*</div>
                <div className="offer-full">מחיר מלא: <b>46,990 ₪</b></div>
                <div className="offer-divider" />
                <div className="offer-pay">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                  <div className="pay-txt">
                    <div className="t1">שלם וסע</div>
                    <div className="t2">משלמים ומקבלים את האופנוע באותו היום</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Form */}
          <section className="form-wrap">
            <form className="form-card" onSubmit={handleSubmit} noValidate>
              <div className="form-head">
                <div className="lead">לרכיבת מבחן</div>
                <div className="sub">השאירו פרטים ונחזור אליכם</div>
              </div>
              <div className="form-row">
                <div className="field-cell">
                  <input className={"field" + (submitted && !nameOk ? " invalid" : "")} type="text" placeholder="שם מלא" dir="rtl" value={form.name} onChange={set("name")} />
                  {submitted && !nameOk && <div className="field-err">נא להזין שם מלא</div>}
                </div>
                <div className="field-cell">
                  <input className={"field" + (submitted && !phoneOk ? " invalid" : "")} type="tel" placeholder="טלפון" dir="rtl" inputMode="numeric" value={form.phone} onChange={set("phone")} />
                  {submitted && !phoneOk && <div className="field-err">טלפון לא תקין</div>}
                </div>
                <div className="field-cell">
                  <input className={"field" + (submitted && !emailOk ? " invalid" : "")} type="email" placeholder="אימייל" dir="rtl" value={form.email} onChange={set("email")} />
                  {submitted && !emailOk && <div className="field-err">אימייל לא תקין</div>}
                </div>
                <div className="field-cell">
                  <select className="field field-select" dir="rtl" value={form.agency} onChange={set("agency")}>
                    <option value="">בחר סוכנות (לא חובה)</option>
                    {AGENCIES.map((a) => <option key={a} value={a}>{a}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-actions">
                <label className={"consent" + (submitted && !consent ? " invalid" : "")}>
                  <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} />
                  <span className="box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                  </span>
                  <span className="txt">אני מאשר/ת קבלת תוכן פרסומי ועדכונים <span style={{color:'#ff6600'}}>*</span></span>
                </label>
                <button type="submit" className="submit" disabled={sending}>{sending ? "שולח..." : "שליחה"}</button>
              </div>
              {submitted && !consent && <div className="field-err" style={{textAlign:'center',marginTop:'8px'}}>יש לאשר קבלת תוכן פרסומי</div>}
              <div className="privacy-note">
                מסירת הפרטים מהווה הסכמה <a className="privacy-link" href={PRIVACY} target="_blank" rel="noopener">למדיניות הפרטיות</a> של ד.ל.ב מוטוספורט
              </div>
            </form>
          </section>

          {done && (
            <div className="modal-overlay" onClick={() => setDone(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="check">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                </div>
                <h3>תודה רבה!</h3>
                <p>קיבלנו את הפרטים שלך<br/>נציג יחזור אליך בהקדם</p>
                <div className="quick">לשיחה מהירה עכשיו</div>
                <div className="arrow">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <a className="wa-btn" href={WA_LINK} target="_blank" rel="noopener">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.74-.86-2.01-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.93 1.16-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.6-.91-2.19-.24-.57-.48-.49-.66-.5-.17-.01-.37-.01-.57-.01-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.87 1.21 3.07.15.2 2.09 3.2 5.07 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.74-.71 1.99-1.4.24-.69.24-1.28.17-1.4-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.42 9.42 0 01-4.8-1.32l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.43 9.45-9.43a9.4 9.4 0 016.67 2.77 9.36 9.36 0 012.76 6.67c0 5.2-4.24 9.43-9.45 9.43zm8.04-17.47A11.32 11.32 0 0012.04.5C5.79.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.6 23.5l6.13-1.61a11.3 11.3 0 005.3 1.35h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.32-8.02z"/></svg>
                  שיחה בוואטסאפ
                </a>
                <button className="close" onClick={() => setDone(false)}>סגירה</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;color:#ff6600;font-family:sans-serif;">שגיאה בטעינה: ' + err.message + '</div>';
    }
  </script>
</body>
</html>
