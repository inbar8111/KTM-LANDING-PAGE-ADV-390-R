  .scroll-hint {

    height: 58px;
    border-radius: 999px;

    justify-content: center;

  .wa-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;

    background: #25D366;
    color: #fff;

</style>
</head>
<body>
  <div class="page-hint">
    <strong>תצוגה מקדימה — מובייל</strong><br/>
    סרטון לרוחב המסך + תג אחריות בפינה · הצעת מחיר נקייה · טופס מעוגל
  </div>

  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel">
    const { IOSDevice } = window;

    function Screen() {
      const scrollRef = React.useRef(null);
      const videoRef = React.useRef(null);
      const [playing, setPlaying] = React.useState(false);
      const handlePlay = () => {
        if (videoRef.current) { videoRef.current.play(); setPlaying(true); }
      };
      const [showHint, setShowHint] = React.useState(true);
      React.useEffect(() => {
        const el = scrollRef.current;
        if (!el) return;
        const onScroll = () => setShowHint(el.scrollTop < 30);
        el.addEventListener('scroll', onScroll, { passive: true });
        return () => el.removeEventListener('scroll', onScroll);
      }, []);

      const WHATSAPP = "972500000000"; // ← replace with the real number
      const WEBHOOK = "https://hook.eu1.make.com/cj13oqusi8whr17zdenvha4wersapub6";

      const [form, setForm] = React.useState({ name: "", phone: "", email: "", agency: "" });
      const [consent, setConsent] = React.useState(false);
      const [submitted, setSubmitted] = React.useState(false);
      const [done, setDone] = React.useState(false);
      const [sending, setSending] = React.useState(false);

      const phoneOk = /^0\d{1,2}-?\d{7}$/.test(form.phone.replace(/\s/g, ""));
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email);
      const nameOk = form.name.trim().length >= 2;

      const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitted(true);
        if (!(nameOk && phoneOk && emailOk && consent)) return;
        setSending(true);
        try {
          await fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: form.name.trim(),
              phone: form.phone.trim(),
              email: form.email.trim(),
              agency: form.agency || "",
              consent: true,
              model: "KTM ADV 390 R",
              source: "landing-mobile",
              submittedAt: new Date().toISOString(),
              date: new Date().toLocaleDateString("he-IL", { timeZone: "Asia/Jerusalem" }),
              time: new Date().toLocaleTimeString("he-IL", { timeZone: "Asia/Jerusalem" }),
            }),
          });
        } catch (err) {
          // network/CORS error — still show thank-you so the user isn't blocked
          console.warn("webhook error", err);
        }
        setSending(false);
        setDone(true);
      };

      return (
        <div className="screen" ref={scrollRef}>
          {done && (
            <div className="modal-overlay" onClick={() => setDone(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="check">

                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>

                <p>קיבלנו את הפרטים שלך<br/>נציג יחזור אליך בהקדם</p>
                <div className="quick">לשיחה מהירה עכשיו</div>
                <div className="arrow">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/>
                  </svg>
                </div>
                <a className="wa-btn" href="https://api.whatsapp.com/send?phone=972527358014&text=%D7%94%D7%99%D7%99%2C%20%D7%90%D7%A0%D7%99%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%9F%20%D7%91ADV%20390%20R%20" target="_blank" rel="noopener">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.47 14.38c-.3-.15-1.74-.86-2.01-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.93 1.16-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.6-.91-2.19-.24-.57-.48-.49-.66-.5-.17-.01-.37-.01-.57-.01-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.87 1.21 3.07.15.2 2.09 3.2 5.07 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.74-.71 1.99-1.4.24-.69.24-1.28.17-1.4-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.42 9.42 0 01-4.8-1.32l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.43 9.45-9.43a9.4 9.4 0 016.67 2.77 9.36 9.36 0 012.76 6.67c0 5.2-4.24 9.43-9.45 9.43zm8.04-17.47A11.32 11.32 0 0012.04.5C5.79.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.6 23.5l6.13-1.61a11.3 11.3 0 005.3 1.35h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.32-8.02z"/>
                  </svg>
                  שיחה בוואטסאפ
                </a>
                <button className="close" onClick={() => setDone(false)}>סגירה</button>
              </div>
            </div>
          )}


          {/* 0. Top header bar with logos */}
          <div className="topbar">
            <img className="ktm-box" src="assets/ktm-box.png" alt="KTM" />
            <img className="dlb" src="assets/dlb-logo-v2.png" alt="D.L.B MotoSport — The Best Adventure You Can Get" />
          </div>

          {/* 1. Landscape video */}
          <div className="video-block">
            <video
              ref={videoRef}
              className="video-el"
              src="assets/adv-390-r.mp4"
              poster="assets/hero-bike.jpg"
              playsInline
              onEnded={() => setPlaying(false)}
            />
            {!playing && (
              <div className="play-btn" onClick={handlePlay} style={{cursor:'pointer'}}>
                <div className="play-btn-inner">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                  </svg>
                </div>
              </div>
            )}

            {!playing && (
              <div className="video-caption">
                <div className="model">ADV <em>390 R</em></div>

            <img className="warranty-badge" src="assets/warranty-4y.png" alt="4 שנות אחריות" />

            {!playing && (
              <div className="scroll-hint" style={{ opacity: showHint ? 1 : 0 }}>

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            )}
          </div>

          {/* 2. Offer — price only, nothing else */}
          <div className="offer-wrap">
            <div className="offer">
              <div className="offer-eyebrow">
                ADV 390 R <span className="dot">·</span> החל מ-
              </div>
              <div className="offer-price">
                <span className="num">1,958</span>
                <span className="currency">₪</span>
                <span className="per">/ חודש</span>
              </div>
              <div className="offer-terms">24 תשלומים ללא ריבית</div>
              <div className="offer-fine">בכרטיס אשראי*</div>
              <div className="offer-full">מחיר מלא: <b>46,990 ₪</b></div>

              <div className="offer-divider" />

              <div className="offer-pay">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
                <div className="pay-txt">
                  <div className="t1">שלם וסע</div>
                  <div className="t2">משלמים ומקבלים את האופנוע באותו היום</div>
                </div>
              </div>
            </div>
          </div>

          {/* 3. Rounded lead form */}
          <div className="form-wrap">
            <form className="form-card" onSubmit={handleSubmit} noValidate>
              <div className="form-title">
                <div className="lead">לרכיבת מבחן</div>
                <div className="sub">מלאו את הפרטים</div>
              </div>
              <div className="field-stack">
                <input
                  className={"field" + (submitted && !nameOk ? " invalid" : "")}
                  type="text" placeholder="שם מלא" dir="rtl"
                  value={form.name} onChange={set("name")}
                />
                {submitted && !nameOk && <div className="field-err">נא להזין שם מלא</div>}

                <input
                  className={"field" + (submitted && !phoneOk ? " invalid" : "")}
                  type="tel" placeholder="טלפון" dir="rtl" inputMode="numeric"
                  value={form.phone} onChange={set("phone")}
                />
                {submitted && !phoneOk && <div className="field-err">מספר טלפון לא תקין</div>}

                <input
                  className={"field" + (submitted && !emailOk ? " invalid" : "")}
                  type="email" placeholder="אימייל" dir="rtl"
                  value={form.email} onChange={set("email")}
                />
                {submitted && !emailOk && <div className="field-err">כתובת אימייל לא תקינה</div>}

                <select className="field field-select" dir="rtl" value={form.agency} onChange={set("agency")}>
                  <option value="">בחר סוכנות (לא חובה)</option>
                  <option>אופנועי כרמיאל</option>
                  <option>מומוגז - ראש פינה</option>
                  <option>מומופאן - עפולה</option>
                  <option>סביון אופנועים - קרית ביאליק</option>
                  <option>אולם ראשי - ת"א</option>
                  <option>אוף-רוד - ת"א</option>
                  <option>מאי מומו - נתניה</option>
                  <option>ביג בן אופנועים - ירושלים</option>
                  <option>מומוספיד - מישור אדומים</option>
                  <option>RPM - רמת השרון</option>
                  <option>המנהוראי - יבנה</option>
                  <option>מלכי ריסינג - קרית גת</option>
                  <option>אקסטרים מומוספורט - ב"ש</option>
                  <option>סאמר אופנועים - אילת</option>
                </select>

                <label className={"consent" + (submitted && !consent ? " invalid" : "")}>
                  <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} />
                  <span className="box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                  </span>
                  <span className="txt">אני מאשר/ת קבלת תוכן פרסומי ועדכונים <span style={{color:'#ff6600'}}>*</span></span>
                </label>
                {submitted && !consent && <div className="field-err">יש לאשר קבלת תוכן פרסומי</div>}

                <button type="submit" className="submit" disabled={sending}>
                  {sending ? "שולח..." : "שליחה"}
                </button>
              </div>
              <div className="form-fine">
                מסירת הפרטים מהווה הסכמה <a className="privacy-link" href="https://www.motosport.co.il/page/%D7%9E%D7%93%D7%99%D7%A0%D7%99%D7%95%D7%AA-%D7%94%D7%A4%D7%A8%D7%98%D7%99%D7%95%D7%AA" target="_blank" rel="noopener">למדיניות הפרטיות</a> של ד.ל.ב מוטוספורט
              </div>
            </form>
          </div>

        </div>
      );
    }

    function App() {
      return (
        <IOSDevice dark title="">
          <Screen />
        </IOSDevice>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
