<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--ktm-black); }
  .card { padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 24px; }
  .spec { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ktm-text-50); min-width: 130px; letter-spacing: 0.04em; text-align: left; direction: ltr; }
  .ex-display { font-weight: 900; font-size: 84px; line-height: 0.95; color: var(--ktm-orange); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ex-h1 { font-weight: 900; font-size: 56px; line-height: 1; color: #fff; letter-spacing: -0.02em; }
  .ex-h2 { font-weight: 900; font-size: 36px; line-height: 1.05; color: #fff; }
</style>
</head>
<body class="ktm-body">
<div class="card">
  <div class="row"><div class="spec">Heebo 900 · -0.02em</div><div class="ex-display">1,958</div></div>
  <div class="row"><div class="spec">Heebo 900 · -0.02em</div><div class="ex-h1">ADV 390 R</div></div>
  <div class="row"><div class="spec">Heebo 900</div><div class="ex-h2">למה ADV 390 R?</div></div>
</div>
</body>
</html>
