<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--ktm-black); }
  .card { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; gap: 24px; }
  .spec { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ktm-text-50); min-width: 160px; letter-spacing: 0.04em; text-align: left; direction: ltr; }
  .eyebrow { font-family: var(--ktm-font-sans); font-weight: 700; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ktm-orange); }
  .h3 { font-family: var(--ktm-font-sans); font-weight: 900; font-size: 20px; color: #fff; }
  .body { font-family: var(--ktm-font-sans); font-weight: 400; font-size: 16px; line-height: 1.6; color: var(--ktm-text-60); }
  .fine { font-family: var(--ktm-font-sans); font-weight: 400; font-size: 12px; line-height: 1.5; color: var(--ktm-text-40); }
</style>
</head>
<body class="ktm-body">
<div class="card">
  <div class="row"><div class="spec">Heebo 700 · 0.3em</div><div class="eyebrow">ההצעה</div></div>
  <div class="row"><div class="spec">Heebo 900 · 20px</div><div class="h3">מנוע 399cc</div></div>
  <div class="row"><div class="spec">Heebo 400 · 16/1.6 · 60%</div><div class="body">מנוע חד-צילינדר עם קירור נוזל, המספק הנעה חזקה וחלקה בכל מצב.</div></div>
  <div class="row"><div class="spec">Heebo 400 · 12/1.5 · 40%</div><div class="fine">* בכפוף לאישור חברת האשראי. 24 תשלומים, ריבית 0%.</div></div>
</div>
</body>
</html>
