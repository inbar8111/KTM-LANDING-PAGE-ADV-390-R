<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--ktm-black); }
  .card { padding: 26px 32px; display: flex; flex-direction: column; gap: 10px; font-family: var(--ktm-font-sans); }
  .row { display: flex; align-items: center; gap: 16px; }
  .label { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ktm-text-50); min-width: 88px; direction: ltr; text-align: left; }
  .sample { color: #fff; font-weight: 400; font-size: 16px; }
  .b3   { font-weight: 300; }
  .b4   { font-weight: 400; }
  .b5   { font-weight: 500; }
  .b6   { font-weight: 600; }
  .b7   { font-weight: 700; color: var(--ktm-orange); }
  .b8   { font-weight: 800; }
  .b9   { font-weight: 900; }
</style>
</head>
<body class="ktm-body">
<div class="card">
  <div class="row"><div class="label">300 Light</div><div class="sample b3">Heebo · אדוונצ'ר · ADV 390 R</div></div>
  <div class="row"><div class="label">400 Regular</div><div class="sample b4">Heebo · אדוונצ'ר · ADV 390 R</div></div>
  <div class="row"><div class="label">500 Medium</div><div class="sample b5">Heebo · אדוונצ'ר · ADV 390 R</div></div>
  <div class="row"><div class="label">600 SemiBold</div><div class="sample b6">Heebo · אדוונצ'ר · ADV 390 R</div></div>
  <div class="row"><div class="label">700 Bold</div><div class="sample b7">Heebo · אדוונצ'ר · ADV 390 R</div></div>
  <div class="row"><div class="label">800 ExtraBold</div><div class="sample b8">Heebo · אדוונצ'ר · ADV 390 R</div></div>
  <div class="row"><div class="label">900 Black</div><div class="sample b9">Heebo · אדוונצ'ר · ADV 390 R</div></div>
</div>
</body>
</html>
